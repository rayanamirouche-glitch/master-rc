<title>Ménage des fiches — R.Consulting</title>
<style>
:root{--violet:#7C3AED;--fuchsia:#D946EF;--coral:#FB7185;--ink:#2A1A40;--muted:#8B7BA0;--line:#EDE6F5;--bg:#FBF6FF;--card:#fff;--emerald:#10B981;--orange:#FB923C;--rouge:#e11d48;
--grad:linear-gradient(125deg,#7C3AED 0%,#D946EF 45%,#FB7185 100%);--grad-cta:linear-gradient(120deg,#8B5CF6,#EC4899);--shadow:0 10px 30px rgba(124,58,237,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
header{position:sticky;top:0;z-index:20;background:var(--grad);color:#fff;padding:12px 18px;box-shadow:0 6px 24px rgba(124,58,237,.25)}
.h1{font-weight:800;font-size:1.05rem}.h2{font-size:.72rem;opacity:.85;margin-top:2px}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 12px;font-size:.7rem;font-weight:800;backdrop-filter:blur(6px)}
.status{font-size:.66rem;font-weight:800;padding:5px 12px;border-radius:30px;background:rgba(255,255,255,.22)}
.search{flex:1;min-width:200px;border:none;border-radius:20px;padding:8px 14px;font-size:.85rem;font-family:inherit;background:rgba(255,255,255,.92);color:var(--ink)}
.search:focus{outline:2px solid #fff}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.client{margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.client h2{font-size:1rem;font-weight:800}.client small{color:var(--muted);font-size:.72rem}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.card.non{opacity:.45}.card.non::after{content:"";position:absolute;inset:0;border-radius:18px;border:2px dashed #e11d48;pointer-events:none}
.card.ok{border-color:var(--emerald)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:.9rem}.meta{font-size:.68rem;color:var(--muted);margin-top:3px}
.meta b{color:var(--violet)}
.maps{background:#EEF6FF;color:#2563EB;border-radius:20px;padding:7px 14px;font-size:.74rem;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0}
.sat{background:#FFF4E8;color:#C2410C;border-radius:20px;padding:3px 9px;font-size:.62rem;font-weight:800;margin-left:6px}
.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:.62rem;font-weight:800;margin:4px 6px 0 0;white-space:nowrap}
.badge.vert{background:#D1FAE5;color:#047857}.badge.orange{background:#FFEDD5;color:#C2410C}.badge.rouge{background:#FEE2E2;color:#B91C1C}.badge.gris{background:#F3F0F9;color:var(--muted)}.badge.bleu{background:#EEF6FF;color:#2563EB}
.badges{margin-top:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.f label{display:block;font-size:.6rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem;font-family:inherit;background:#FBF8FF;color:var(--ink)}
.f textarea{min-height:58px;resize:vertical;font-size:.78rem;line-height:1.35}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--violet);border-color:transparent}
.f.wide{grid-column:1/-1}
.g{display:flex;gap:6px}.g button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:800;font-size:.78rem;cursor:pointer;color:var(--muted)}
.g button.oui{background:var(--emerald);color:#fff;border-color:transparent}.g button.non{background:#e11d48;color:#fff;border-color:transparent}.g button.voir{background:var(--orange);color:#fff;border-color:transparent}
.ratio{font-size:.7rem;font-weight:800;margin-top:8px;color:var(--muted)}
.ck{grid-column:1/-1;background:#FBF8FF;border:1px solid var(--line);border-radius:12px;padding:10px}
.ck .ckt{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.ck .ckl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.ck label.ci{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;cursor:pointer}
.ck label.ci input{width:16px;height:16px;accent-color:var(--violet)}
.ck .gst{font-size:.6rem;font-weight:800;border-radius:12px;padding:1px 7px}
.ck .gst.vert{background:#D1FAE5;color:#047857}.ck .gst.rouge{background:#FEE2E2;color:#B91C1C}.ck .gst.gris{background:#EDE6F5;color:var(--muted)}
.pbar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.pfill{height:100%;background:var(--grad-cta);border-radius:3px}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:center;z-index:30;flex-wrap:wrap}
.foot button{border:none;border-radius:24px;padding:10px 18px;font-weight:800;font-size:.8rem;cursor:pointer}
.b1{background:var(--grad-cta);color:#fff}.b2{background:#F6F0FE;color:var(--violet)}.b3{background:var(--emerald);color:#fff}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:30px;font-size:.8rem;font-weight:700;opacity:0;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.filtres{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filtres button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--muted)}
.filtres button.on{background:var(--violet);color:#fff;border-color:transparent}
.filtres.vues button.on{background:var(--ink)}
.filtres button b{margin-left:5px;opacity:.75}
.bandeau{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto;margin:10px 0}
.bandeau table{width:100%;border-collapse:collapse;font-size:.74rem;min-width:520px}
.bandeau th{font-size:.58rem;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
.bandeau th:first-child,.bandeau td:first-child{text-align:left}
.bandeau td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer}
.bandeau tr:hover td{background:#FBF6FF}.bandeau tr.on td{background:#F3EBFF}
.bandeau tr.total td{font-weight:800;color:var(--violet);cursor:default}
.acmd{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
.acmd table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:520px}
.acmd th{font-size:.58rem;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.acmd td{padding:8px 10px;border-bottom:1px solid var(--line)}
.acmd td.n{text-align:right;font-weight:800;color:var(--violet)}
.empty{color:var(--muted);font-size:.8rem;padding:20px;text-align:center}
</style></head><body>
<header><div class="h1">Ménage des fiches</div><div class="h2"><span id="hnb">303</span> fiches · clique Maps, vérifie la ville et les avis récents, remplis, ça se sauvegarde tout seul</div>
<div class="bar"><input class="search" id="q" placeholder="Rechercher : fiche, ville, client, notes, mot-clé…" oninput="Q=this.value;rendreTout()"><span class="pill" id="prog">0 / 303 traitées</span><span class="status" id="st">…</span></div></header>
<div class="wrap">
<div class="bandeau" id="bandeau"></div>
<div class="filtres" id="filtres"></div>
<div class="filtres vues" id="vues"></div>
<div id="liste"></div>
</div>
<div class="foot"><button class="b1" onclick="exporter()">Exporter pour Claude</button><button class="b3" id="bcopie" style="display:none" onclick="copierListe()">Copier la liste</button><button class="b2" onclick="ouvrirAjout()">+ Fiche</button><button class="b2" onclick="tout(1)">Tout à « Oui »</button></div>

<div class="f"><label>Ville</label><input id="a_v"></div>

<div class="f wide"><label>Lien Maps</label><input id="a_l" placeholder="https://maps.app.goo.gl/…"></div>
<div class="f"><label>Métier</label><select id="a_met"><option>Couvreur</option><option>PAC air/eau</option><option>Chaudière</option><option>Nuisibles</option><option>Élagage</option><option>Façade</option><option>Autre</option></select></div>
<div class="f"><label>Langue</label><select id="a_lg"><option>FR</option><option>FR (Belgique)</option><option>FR + NL</option></select></div>
</div>
<div class="g" style="margin-top:12px"><button class="oui" onclick="ajouter()">Ajouter</button><button onclick="document.getElementById('modal').style.display='none'">Annuler</button></div>
</div></div>
